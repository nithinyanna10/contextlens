[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextlens"
version = "0.1.0"
description = "pytest-native context-window linter for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "anthropic>=0.25",
    "pytest>=8.0",
]

[project.scripts]
contextlens = "contextlens.cli:main"

[project.entry-points."pytest11"]
contextlens = "contextlens.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/contextlens"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stress: offline stress tests — synthetic payloads, no API calls",
]
